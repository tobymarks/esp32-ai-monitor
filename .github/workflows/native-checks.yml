name: Native checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'companion/Sources/**'
      - 'companion/Tests/**'
      - 'companion-windows/crates/**'
      - 'companion-windows/src/**'
      - 'companion-windows/src-tauri/**'
      - 'companion-windows/tests/**'
      - 'companion-windows/package.json'
      - 'companion-windows/pnpm-lock.yaml'
      - 'companion-windows/Cargo.toml'
      - 'companion-windows/Cargo.lock'
      - 'tests/**'
      - 'scripts/**'
      - 'platformio.ini'
      - '.github/workflows/native-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion-windows -> target
      # Native tests need only headers and LVGL, not ESP32 platforms/toolchains.
      # Read the existing version pins so CI cannot silently test another LVGL.
      - name: Install native firmware dependencies
        run: |
          pip install platformio
          mkdir -p .pio/libdeps/esp32dev
          python - <<'PY'
          import configparser
          import subprocess
          config = configparser.ConfigParser(interpolation=None)
          config.read('platformio.ini')
          libraries = [line.strip() for line in config['env']['lib_deps'].splitlines()
                       if line.strip().startswith(('lvgl/', 'bblanchon/ArduinoJson@'))]
          assert len(libraries) == 2, libraries
          args = ['pio', 'pkg', 'install', '--global', '--skip-dependencies',
                  '--storage-dir', '.pio/libdeps/esp32dev']
          for library in libraries:
              args.extend(['--library', library])
          subprocess.run(args, check=True)
          PY
      - name: Test shared core, plugin store and Mac helper
        working-directory: companion-windows
        run: cargo test --locked -p aimonitor-core -p aimonitor-plugin-store -p aimonitor-plugin-host
      - name: Test panel identification
        run: bash scripts/test_panel_id_native.sh
      - name: Test standalone ownership and host/device rendering contract
        run: |
          bash scripts/test_display_owner_native.sh
          bash scripts/test_standalone_bounds_native.sh
          bash scripts/test_standalone_transfer_native.sh
          bash scripts/test_standalone_http_native.sh
          bash scripts/test_standalone_record_native.sh
          bash scripts/test_standalone_policy_native.sh
          bash scripts/test_standalone_contract.sh
      - name: Test plugin package, scene protocol and native rendering
        run: bash scripts/test_display_plugin_scene_contract.sh

  mac-smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Parse Swift sources and test the display window editor state
        run: bash scripts/test_mac_view_editor.sh
      - name: Test standalone commands across device reconnects
        run: python3 tests/standalone_mac_connection.py
      - name: Install native firmware dependencies
        run: |
          pip install platformio
          mkdir -p .pio/libdeps/esp32dev
          python - <<'PY'
          import configparser
          import subprocess
          config = configparser.ConfigParser(interpolation=None)
          config.read('platformio.ini')
          libraries = [line.strip() for line in config['env']['lib_deps'].splitlines()
                       if line.strip().startswith(('lvgl/', 'bblanchon/ArduinoJson@'))]
          assert len(libraries) == 2, libraries
          args = ['pio', 'pkg', 'install', '--global', '--skip-dependencies',
                  '--storage-dir', '.pio/libdeps/esp32dev']
          for library in libraries:
              args.extend(['--library', library])
          subprocess.run(args, check=True)
          PY
      - name: Render dashboard screenshots without changing website assets
        env:
          AIMONITOR_SITE_BUILD_DIR: ${{ runner.temp }}/site-render
          AIMONITOR_SITE_OUTPUT_DIR: ${{ runner.temp }}/site-screens
        run: bash scripts/render_site_screens.sh

  companion-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: companion-windows/pnpm-lock.yaml
      - name: Build frontend
        working-directory: companion-windows
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test standalone capability and asynchronous state
        run: |
          STANDALONE_TEST_DEPS="$(mktemp -d)"
          npm install --prefix "$STANDALONE_TEST_DEPS" --no-package-lock --ignore-scripts react@18.3.1 react-test-renderer@18.3.1
          AIMONITOR_REACT_TEST_DEPS="$STANDALONE_TEST_DEPS" node companion-windows/tests/standalone.cjs

name: Mac App Build

# Trigger nur auf App-Tags (app-v1.x.x), damit der macos-Runner nicht bei jedem
# Commit Zeit verbrennt. Manuell per `gh workflow run mac-app.yml` oder
# UI-Dispatch startbar — dann wird ohne Release-Upload nur das Bundle gebaut.
on:
  push:
    tags:
      - 'app-v*.*.*'
      - 'app-beta-v*'
  workflow_dispatch:
    inputs:
      upload_to_release:
        description: 'Upload ZIP+DMG zum vorhandenen Release (Tag manuell angeben)'
        required: false
        default: 'false'
      tag:
        description: 'Release-Tag (nur bei workflow_dispatch mit upload=true)'
        required: false

# contents: write wird fuer `gh release upload` gebraucht — ohne diese
# permission liefert die API 403 ('Resource not accessible by integration').
# Default-Repo-Permission bei Org-Repos ist oft nur 'read'.
permissions:
  contents: write

jobs:
  build:
    # macos-26 statt macos-14 (ab App 1.23.0): der alte Runner brachte Xcode
    # 15.4 mit und baute damit gegen SDK 14.5. Das neue Systemaussehen
    # (Liquid Glass) greift laut Apple nur, wenn gegen das aktuelle SDK
    # gelinkt wird — die Releases sahen deshalb anders aus als lokale Builds.
    # Ausserdem versteht erst das actool ab Xcode 26 das .icon-Format des
    # App-Icons.
    runs-on: macos-26
    # Exponiert als env, damit Schritte per `if: env.MACOS_CERT_P12_BASE64 != ''`
    # erkennen, ob Signing-Secrets hinterlegt sind. Fehlen sie, baut build.sh
    # ad-hoc (kein Bruch) — der Developer-ID-Pfad greift erst nach Secret-Setup.
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Die App-Version steht an drei manuell gepflegten Stellen. Bei einem
      # app-v* / app-beta-v*-Tag muessen alle drei zum Tag passen, sonst meldet
      # der In-App-Updater eine andere Version als ausgeliefert wird.
      - name: Verify app version matches tag
        if: startsWith(github.ref, 'refs/tags/app-v') || startsWith(github.ref, 'refs/tags/app-beta-v')
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [[ "$REF" == app-beta-v* ]]; then TAG="${REF#app-beta-v}"; else TAG="${REF#app-v}"; fi
          CODE=$(grep 'let kAppVersion' companion/Sources/main.swift | head -1 | sed 's/.*"\(.*\)".*/\1/')
          BUILDSH=$(grep '^APP_VERSION=' companion/build.sh | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PLIST=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' companion/Resources/Info.plist)
          fail=0
          for pair in "kAppVersion:$CODE" "build.sh:$BUILDSH" "Info.plist:$PLIST"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ "$val" != "$TAG" ]; then
              echo "::error::Tag $REF passt nicht zu $name '$val' (erwartet Version $TAG)"
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "Version OK: $TAG"
          exit $fail

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          echo "Installierte Xcode-Versionen:"
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          echo "Ausgewaehlt: $LATEST"

      - name: Show environment
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          SDK=$(xcrun --show-sdk-version)
          echo "macOS SDK: $SDK"
          # Harte Schranke: ohne SDK 26 baut die CI ein anderes Produkt als der
          # lokale Build — Standard-Controls bekommen das neue Systemaussehen
          # nicht, und actool kann das .icon-App-Icon nicht kompilieren. Das
          # soll auffallen und nicht still durchgehen.
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS-SDK $SDK ist zu alt. Liquid Glass und das .icon-App-Icon brauchen SDK 26 (Xcode 26)."
            exit 1
          fi

      - name: Install PlatformIO (fuer esptool-Bundle in AI Monitor.app)
        run: |
          # build.sh kopiert das PlatformIO-esptool-Package in die App-Bundle-
          # Resources. Ohne diesen Step faellt die gebaute App auf system-
          # installiertes esptool zurueck und das ZIP/DMG ist ~8x kleiner.
          #
          # --break-system-packages: Seit dem macos-14-Runner ist das System-
          # Python "externally managed" (PEP 668); ohne dieses Flag bricht pip
          # mit exit 1 ab und der ganze Job schlaegt fehl. Auf dem Wegwerf-
          # Runner ist das unkritisch.
          python3 -m pip install --user --break-system-packages --upgrade platformio
          python3 -m platformio platform install espressif32 || true

      # Optionales Developer-ID-Signing + Notarization. Läuft NUR, wenn die
      # Secrets hinterlegt sind. Importiert das .p12 in eine temporäre Keychain
      # und legt ein notarytool-Profil "AC_NOTARY" an. build.sh erkennt die
      # Identity dann automatisch (security find-identity) und signiert +
      # notarisiert statt ad-hoc — so persistiert macOS die "Daten aus anderen
      # Apps"-Erlaubnis (stabile Code-Signatur) und der Start-Dialog kommt nur
      # einmal statt bei jedem Start.
      - name: Import Developer ID signing certificate
        if: env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Temp-Keychain der Suchliste voranstellen (find-identity sieht sie),
          # und als default setzen (notarytool-Profil landet/liest dort).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          xcrun notarytool store-credentials "AC_NOTARY" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "Signing keychain ready."

      - name: Prepare Rust plugin helper targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test shared display-plugin contract
        working-directory: companion-windows
        run: cargo test -p aimonitor-core -p aimonitor-plugin-host --locked

      - name: Build AI Monitor.app
        working-directory: companion
        env:
          NOTARY_PROFILE: AC_NOTARY
        run: |
          # build.sh erzeugt /tmp/aimonitor-build/AI Monitor.app, kopiert nach
          # companion/build/ und baut ZIP + DMG. Mit hinterlegten Signing-Secrets
          # (Developer ID im Keychain) signiert + notarisiert build.sh; sonst
          # ad-hoc (codesign --sign -), Quarantine wird beim Start per xattr-Clean
          # entfernt.
          if [ -n "${MACOS_CERT_P12_BASE64:-}" ]; then
            export NOTARIZE=1
            echo "Developer-ID-Build (signiert + notarisiert)."
          else
            echo "Ad-hoc-Build (keine Signing-Secrets hinterlegt)."
          fi
          ./build.sh

      - name: Smoke test bundled display-plugin helper
        run: |
          set -euo pipefail
          HELPER="companion/build/AI Monitor.app/Contents/MacOS/aimonitor-plugin-host"
          PACKAGE="$RUNNER_TEMP/display-fixture.aimplugin"
          python3 scripts/package_display_plugin.py \
            tests/fixtures/display-plugin/plugin.json "$PACKAGE"
          "$HELPER" inspect "$PACKAGE" > "$RUNNER_TEMP/fixture-preview.json"
          "$HELPER" render "$PACKAGE" - all \
            tests/fixtures/display-plugin/response.json \
            > "$RUNNER_TEMP/fixture-scenes.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          preview = json.loads((root / "fixture-preview.json").read_text())
          assert preview["id"] == "org.aimonitor.fixture"
          assert preview["sourceOrigin"] == "https://example.org"
          assert preview["signed"] is False
          scenes = json.loads((root / "fixture-scenes.json").read_text())["scenes"]
          assert set(scenes) == {"portrait", "landscape", "square"}
          for name, scene in scenes.items():
              nodes = scene["nodes"]
              assert any(node.get("text") == "Demo" for node in nodes), name
              assert any(node.get("text") == "18 pts" for node in nodes), name
              assert any(node.get("type") == "bar" and node.get("value") == 62
                         for node in nodes), name
          print("Bundled Mac plugin helper inspected and rendered the fixture in all layouts")
          PY

      - name: List build artifacts
        working-directory: companion
        run: ls -lah build/

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: AIMonitor-zip
          path: companion/build/AIMonitor.zip
          if-no-files-found: error

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: AIMonitor-dmg
          path: companion/build/AIMonitor.dmg
          if-no-files-found: warn

      # CI baut vollstaendig signiert + notarisiert + gestapelt: der Job
      # importiert die Developer ID aus den Repo-Secrets und setzt NOTARIZE=1,
      # build.sh erledigt Signing, Notarisierung und Stapling.
      #
      # Bis v1.26.0 stand hier ein Guard, der den Upload uebersprang, sobald
      # AIMonitor.zip bereits am Release hing — noetig, solange CI nur ad-hoc
      # signierte und die echten Assets von Hand hochgeladen wurden. Seit die
      # Signing-Secrets hinterlegt sind, liefert CI dieselbe Qualitaet; der
      # Guard erzwang nur noch unnoetige lokale Builds und ist entfallen.
      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v') || startsWith(github.ref, 'refs/tags/app-beta-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Release anlegen, falls es noch nicht existiert. Beta-Tags
          # (app-beta-v*) werden als prerelease markiert, damit der In-App-
          # Updater sie ausschliesslich im Beta-Kanal anbietet.
          # Existiert bereits ein Release mit eigenen Notes, bleibt es
          # unveraendert — hier werden dann nur die Assets angehaengt.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == app-beta-v* ]]; then
              gh release create "$TAG" --prerelease --title "$TAG" \
                --notes "Automatisierter Beta-Build (signiert und notarisiert)."
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          fi
          echo "Uploading notarized CI build to $TAG."
          gh release upload "$TAG" \
            companion/build/AIMonitor.zip \
            companion/build/AIMonitor.dmg \
            --clobber

          # Gegenprobe: Was hochgeladen wurde, muss Gatekeeper passieren.
          # Faengt ab, dass ein unbemerkt ad-hoc signierter Build als Release
          # herausgeht, falls die Signing-Secrets einmal fehlen.
          spctl -a -t open --context context:primary-signature -vv \
            companion/build/AIMonitor.dmg

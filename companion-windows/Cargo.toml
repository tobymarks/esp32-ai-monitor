[workspace]
resolver = "2"
members = ["crates/core", "crates/serial", "crates/flash", "src-tauri"]

[workspace.package]
version = "1.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/tobymarks/esp32-ai-monitor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serialport = "4.10"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[workspace]
resolver = "2"
members = ["crates/core", "crates/serial", "crates/flash", "crates/plugin-host", "crates/plugin-store", "src-tauri"]

[workspace.package]
version = "1.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/tobymarks/esp32-ai-monitor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Match the firmware's correctly rounded strtod conversion for raw source JSON.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
serialport = "4.10"
sha2 = "0.10"
ureq = { version = "3", features = ["json", "platform-verifier"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

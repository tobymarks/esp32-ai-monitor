; Hardware-Test ESP32-S3-4848S040 (Guition, 4" 480x480, ST7701S RGB + GT911)
;
; Eigenstaendiges Projekt, NICHT Teil des Release-Builds: der Root-`pio run`
; und die CI sehen diesen Ordner nicht. Zweck: Display-Timings, Farben,
; Touch-Ausrichtung, Backlight-PWM und Bildstabilitaet bei Flash-Schreibzugriffen
; pruefen, bevor die Board-Schnittstelle in die Firmware kommt.
;
; Core 3.x (pioarduino) nur fuer dieses Board: der Bounce Buffer des RGB-Treibers
; gibt es erst ab ESP-IDF 5. Die CYD-Builds im Root bleiben auf espressif32@6.13.0.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; WROOM-1 N16R8: 16 MB Flash (QIO), 8 MB PSRAM (Octal)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

lib_deps =
    moononournation/GFX Library for Arduino@1.6.7

build_flags =
    -D BOARD_HAS_PSRAM

; Standard: Bounce Buffer mit 10 Zeilen im internen RAM. Soll das Verrutschen
; des Bildes bei Flash-Schreibzugriffen (NVS, WLAN) verhindern.
[env:4848s040]
build_flags =
    ${env.build_flags}
    -D BOUNCE_BUFFER_PX=4800

; Vergleich: ohne Bounce Buffer. Nur flashen, wenn die Standard-Umgebung
; Probleme zeigt oder der Unterschied sichtbar gemacht werden soll.
[env:4848s040-ohne-bb]
build_flags =
    ${env.build_flags}
    -D BOUNCE_BUFFER_PX=0

; Mehr Reserve gegen verrutschende Bilder: Bounce Buffer auf 20 Zeilen,
; Pixeltakt von 12 auf 10 MHz gesenkt. Kostet Bildrate, gibt dem Treiber
; aber mehr Zeit, den Puffer nachzufuellen.
[env:4848s040-sanft]
build_flags =
    ${env.build_flags}
    -D BOUNCE_BUFFER_PX=9600
    -D PCLK_HZ=10000000

; Maximale Reserve: 8 MHz Pixeltakt, Bounce Buffer ueber 40 Zeilen. Bildrate
; faellt auf rund 28 Hz. Zeigt, ob das Verrutschen reine Bandbreitenfrage ist.
[env:4848s040-reserve]
build_flags =
    ${env.build_flags}
    -D BOUNCE_BUFFER_PX=19200
    -D PCLK_HZ=8000000

; Gegenprobe: grosser Puffer wie in -reserve, aber Pixeltakt zurueck auf
; 10 MHz. Zeigt, ob die Puffergroesse allein reicht (rund 35 Hz Bildrate).
[env:4848s040-puffer]
build_flags =
    ${env.build_flags}
    -D BOUNCE_BUFFER_PX=19200
    -D PCLK_HZ=10000000

; Tiefere Ebene: eigene Framework-Konfiguration. Programmcode und Konstanten
; wandern ins PSRAM, damit der Zwischenspeicher bei Flash-Schreibzugriffen
; nicht mehr abgeschaltet werden muss — genau die Ursache der Aussetzer.
; Dazu die RGB-Treiber-Optionen aus der Espressif-Dokumentation.
; Achtung: baut das ESP-IDF aus dem Quelltext, der erste Build dauert lange.
[env:4848s040-idf]
build_flags =
    ${env.build_flags}
    -D BOUNCE_BUFFER_PX=19200
    -D PCLK_HZ=10000000
    -D CORE_DEBUG_LEVEL=3
custom_sdkconfig =
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y
    CONFIG_GDMA_CTRL_FUNC_IN_IRAM=y
